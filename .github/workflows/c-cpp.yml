name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: compile
      run: gcc test_tabela-ox.c -o test_tabela-ox
    - name: execute
      run: ./test_tabela-ox
    - name: compile programa principal
      run: gcc tabela-ox.c -o tabela-ox
    - name: execute programa principal
      run: ./tabela-ox
